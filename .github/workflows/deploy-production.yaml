name: Deploy Production

on:
  workflow_dispatch:
    inputs:
      play-store-track:
        description: "Play Store track"
        required: true
        default: "production"
        type: choice
        options:
          - internal
          - alpha
          - beta
          - production
      notes:
        description: "Release notes"
        required: false
        default: "Production release"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build AAB (Production)
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      FLUTTER_VERSION: "3.44.2"
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Free disk space
        uses: ./.github/actions/free-disk-space

      - name: Flutter Setup
        uses: ./.github/actions/flutter-setup
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          skip-analysis: "true"

      - name: Android Setup
        uses: ./.github/actions/android-setup
        with:
          keystore: ${{ secrets.RELEASE_KEYSTORE }}
          keystore-passphrase: ${{ secrets.RELEASE_KEYSTORE_PASSPHRASE }}
          keystore-password: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          keystore-alias: ${{ secrets.RELEASE_KEYSTORE_ALIAS }}

      - name: Validate production defines
        env:
            APP_ID: ${{ secrets.PROD_APP_ID }}
            APP_SECRET: ${{ secrets.PROD_APP_SECRET }}
            BASE_DOMAIN: ${{ secrets.PROD_BASE_DOMAIN }}
            SOCKET_DOMAIN: ${{ secrets.PROD_SOCKET_DOMAIN }}
            SOCKET_KEY: ${{ secrets.PROD_SOCKET_KEY }}
            AZURE_CONN_STRING: ${{ secrets.PROD_AZURE_CONN_STRING }}
            HIVE_ENCRYPTION_KEY: ${{ secrets.PROD_HIVE_ENCRYPTION_KEY }}
            POSTHOG_KEY: ${{ secrets.PROD_POSTHOG_KEY }}
        run: |
            missing=""
            for key in APP_ID APP_SECRET BASE_DOMAIN SOCKET_DOMAIN SOCKET_KEY AZURE_CONN_STRING HIVE_ENCRYPTION_KEY POSTHOG_KEY; do
            value="${!key}"
            if [ -z "$value" ]; then
                missing="$missing $key"
            fi
            done

            if [ -n "$missing" ]; then
            echo "Missing required production secrets:$missing"
            exit 1
            fi

      - name: Build AAB
        env:
            APP_ID: ${{ secrets.PROD_APP_ID }}
            APP_SECRET: ${{ secrets.PROD_APP_SECRET }}
            BASE_DOMAIN: ${{ secrets.PROD_BASE_DOMAIN }}
            SOCKET_DOMAIN: ${{ secrets.PROD_SOCKET_DOMAIN }}
            SOCKET_KEY: ${{ secrets.PROD_SOCKET_KEY }}
            AZURE_CONN_STRING: ${{ secrets.PROD_AZURE_CONN_STRING }}
            HIVE_ENCRYPTION_KEY: ${{ secrets.PROD_HIVE_ENCRYPTION_KEY }}
            POSTHOG_KEY: ${{ secrets.PROD_POSTHOG_KEY }}
            NO_OPUS_OGG_LIBS: "1"
        run: |
          flutter build appbundle \
            --flavor production \
            --target lib/main_production.dart -v \
            --obfuscate --split-debug-info=debug-symbols \
            --dart-define=APP_ID="$APP_ID" \
            --dart-define=APP_SECRET="$APP_SECRET" \
            --dart-define=BASE_DOMAIN="$BASE_DOMAIN" \
            --dart-define=SOCKET_DOMAIN="$SOCKET_DOMAIN" \
            --dart-define=SOCKET_KEY="$SOCKET_KEY" \
            --dart-define=AZURE_CONN_STRING="$AZURE_CONN_STRING" \
            --dart-define=HIVE_ENCRYPTION_KEY="$HIVE_ENCRYPTION_KEY" \
            --dart-define=POSTHOG_KEY="$POSTHOG_KEY"

      - name: Upload AAB artifact
        uses: actions/upload-artifact@v7
        with:
          name: aab-artifact
          path: build/app/outputs/bundle/productionRelease/app-production-release.aab
          retention-days: 1

      - name: Upload debug symbols artifact
        uses: actions/upload-artifact@v7
        with:
          name: debug-symbols
          path: debug-symbols/
          retention-days: 1

  firebase:
    name: Push to Firebase (Production)
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download AAB artifact
        uses: actions/download-artifact@v8
        with:
          name: aab-artifact

      - name: Upload AAB to Firebase App Distribution
        uses: wzieba/Firebase-Distribution-Github-Action@v1
        with:
          appId: ${{ secrets.FIREBASE_PROD_APP_ID }}
          serviceCredentialsFileContent: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          groups: dev-team
          releaseNotes: ${{ github.event.inputs.notes }}
          file: app-production-release.aab

  crashlytics:
    name: Upload Symbols to Crashlytics
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download debug symbols artifact
        uses: actions/download-artifact@v8
        with:
          name: debug-symbols
          path: debug-symbols

      - name: Upload debug symbols to Firebase Crashlytics
        env:
          FIREBASE_CRED: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          FIREBASE_APP: ${{ secrets.FIREBASE_PROD_APP_ID }}
        run: |
          echo "$FIREBASE_CRED" > /tmp/firebase-credentials.json
          export GOOGLE_APPLICATION_CREDENTIALS=/tmp/firebase-credentials.json
          zip -r debug-symbols.zip debug-symbols
          curl -sL https://firebase.tools | bash
          firebase crashlytics:symbols:upload --app="$FIREBASE_APP" debug-symbols.zip

  google-play:
    name: Push to Google Play Store
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download AAB artifact
        uses: actions/download-artifact@v8
        with:
          name: aab-artifact

      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
          bundler-cache: true

      - name: Install Fastlane
        run: |
          gem install bundler:2.0.2
          bundle install

      - name: Release to Google Play
        env:
          SUPPLY_PACKAGE_NAME: ${{ secrets.ANDROID_PACKAGE_NAME }}
          SUPPLY_JSON_KEY_DATA: ${{ secrets.PLAY_STORE_CREDENTIALS }}
          PLAY_TRACK: ${{ github.event.inputs.play-store-track || 'production' }}
        run: |
          bundle exec fastlane supply \
            --aab app-production-release.aab \
            --track "$PLAY_TRACK"

  huawei:
    name: Push to Huawei AppGallery
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download AAB artifact
        uses: actions/download-artifact@v8
        with:
          name: aab-artifact

      - name: Deploy to Huawei AppGallery
        uses: muhamedzeema/appgallery-deply-action@main
        with:
          client-id: ${{ secrets.HUAWEI_CLIENT_ID }}
          client-key: ${{ secrets.HUAWEI_CLIENT_KEY }}
          app-id: ${{ secrets.HUAWEI_APP_ID }}
          file-extension: "aab"
          file-path: "app-production-release.aab"
          file-name: "production-release"
          submit: false
