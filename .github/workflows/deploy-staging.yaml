name: Deploy Staging

on:
  workflow_dispatch:
    inputs:
      notes:
        description: "Release notes for this staging build"
        required: false
        default: "Staging build"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-apk:
    name: Build & Distribute APK (Staging)
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Flutter Setup
        uses: ./.github/actions/flutter-setup
        with:
          skip-analysis: "true"

      - name: Android Setup
        uses: ./.github/actions/android-setup
        with:
          keystore: ${{ secrets.RELEASE_KEYSTORE }}
          keystore-passphrase: ${{ secrets.RELEASE_KEYSTORE_PASSPHRASE }}
          keystore-password: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          keystore-alias: ${{ secrets.RELEASE_KEYSTORE_ALIAS }}

      - name: Build APK
        run: |
          flutter build apk \
            --flavor staging \
            --target lib/main_staging.dart \
            --release

      - name: Upload APK to Firebase App Distribution
        uses: wzieba/Firebase-Distribution-Github-Action@v1
        with:
          appId: ${{ secrets.FIREBASE_STG_APP_ID }}
          serviceCredentialsFileContent: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          groups: dev-team
          releaseNotes: ${{ github.event.inputs.notes }}
          file: build/app/outputs/flutter-apk/app-staging-release.apk
